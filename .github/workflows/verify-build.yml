name: Verify MonForfait build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function
        run: deno check supabase/functions/leads-gateway/index.ts
      - name: Edge domain unit tests
        run: deno test supabase/functions/leads-gateway/rules.test.ts
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-placeholder
      - name: Runtime route smoke tests
        run: node scripts/smoke-routes.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-placeholder
