<!-- ║  PARTIE 2 — JavaScript à ajouter au formulaire existant ║ -->
<!-- ╚══════════════════════════════════════════════════════════╝ -->
<script>
/**
 * À ajouter dans le script de soumission du formulaire existant.
 * Après soumission réussie (lead créé en DB), appeler triggerVoiceQueue().
 *
 * IMPORTANT: triggerVoiceQueue() est appelé APRÈS que le lead est en DB
 * avec son ID. Ne jamais appeler avant d'avoir l'ID du lead.
 */

/**
 * Met le lead en file d'attente pour être appelé par l'agent IA.
 * @param {number} leadId - ID du lead nouvellement créé
 * @param {boolean} consentVoice - Le prospect a-t-il coché la case ?
 */
async function triggerVoiceQueue(leadId, consentVoice) {
  if (!consentVoice) {
    console.log('[voice] Pas de consentement — lead non mis en file d appel');
    return;
  }

  try {
    const response = await fetch('/api/voice/queue', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        // Ajouter le CSRF token si nécessaire (Laravel, etc.)
        // 'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.content
      },
      body: JSON.stringify({ lead_id: leadId })
    });

    if (!response.ok) throw new Error('Queue API error: ' + response.status);

    const data = await response.json();
    console.log('[voice] Lead mis en file d appel:', data);

  } catch (err) {
    // Ne PAS bloquer l'UX si la file d'appels échoue
    // Le lead reste en DB, on peut le rappeler manuellement
    console.error('[voice] Erreur mise en file:', err.message);
  }
}


// ─── EXEMPLE D'INTÉGRATION avec le submit existant ───────────────────────────
// Adapter selon le code JavaScript actuel de monforfait.ma

document.getElementById('comparison-form')?.addEventListener('submit', async function(e) {
  e.preventDefault();

  const formData = new FormData(this);
  const consentVoice = formData.get('consent_voice') === '1';

  // Validation du consentement
  if (!consentVoice) {
    document.getElementById('consent-error').style.display = 'block';
    return;
  }
  document.getElementById('consent-error').style.display = 'none';

  // Soumission du formulaire existant (adapter l'URL)
  try {
    const response = await fetch('/api/leads', {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (result.lead_id) {
      // ← Ajouter CES DEUX LIGNES après la création du lead
      await triggerVoiceQueue(result.lead_id, consentVoice);
      // Continuer le flow existant (redirection, message de succès, etc.)
    }

  } catch (err) {
    console.error('Form submit error:', err);
  }
});

</script>

<!-- ║  PARTIE 3 — Champ caché pour tracer la source du lead   ║ -->
<!-- ╚══════════════════════════════════════════════════════════╝ -->
<!--
  Ajouter dans le formulaire pour tracer d'où vient le lead.
  Utile pour analyser quelle source génère les meilleurs leads vocaux.
-->
<input type="hidden" id="lead_source" name="lead_source" value="">
<input type="hidden" id="lead_utm_source" name="utm_source" value="">
<input type="hidden" id="lead_utm_medium" name="utm_medium" value="">
<input type="hidden" id="lead_utm_campaign" name="utm_campaign" value="">

<script>
// Capture automatique des paramètres UTM et de la source
(function() {
  const params = new URLSearchParams(window.location.search);
  const set    = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };

  set('lead_utm_source',   params.get('utm_source')   || document.referrer || 'direct');
  set('lead_utm_medium',   params.get('utm_medium')   || '');
  set('lead_utm_campaign', params.get('utm_campaign') || '');
  set('lead_source',       params.get('utm_source') ? 'paid' : (document.referrer.includes('google') ? 'google_organic' : 'direct'));
})();
</script>
